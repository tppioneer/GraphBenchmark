# AIS-012 smoke experiment configuration.
#
# SMOKE-ONLY. This is a declarative input-wiring check, NOT a formal experiment
# and NOT an execution manifest. It pins the inputs a formal run would consume
# (case + ground truth + Profile + Judge model + paired Graph/Grep conditions)
# so they can be schema/rubric-validated end-to-end without executing anything.
#
# Intentionally NOT supplied here (and therefore NOT executable as a formal run):
#   * agent_adapter  - no concrete AgentAdapter is wired (null).
#   * formal_judge_result - no Judge call is made and no score/artifact produced.
#   * credentials / secret values - none are present; none are read or written.
#   * repo url/revision - the source case provides no verified repository
#     pointer, so none is fabricated or pinned here.
#   * generated answer, score, or artifact result - none is present.
experiment_id: qwenpaw-corrupt-inbox-smoke-v1
purpose: smoke
status: smoke_only
case_id: qwenpaw-case-z-corrupt-inbox-recovery-bug
task_type: bug_localization
scoring_profile: bug_localization_v1
case: cases/qwenpaw/qwenpaw-case-z-corrupt-inbox-recovery-bug.yaml
ground_truth: ground-truth/qwenpaw/qwenpaw-case-z-corrupt-inbox-recovery-bug.yaml
judge_model: glm-5.2
# Paired Graph/Grep conditions: the same case is run once per condition so the
# two tool policies are directly comparable. No output is produced in smoke mode.
conditions:
  - id: graph
    tool_policy: graph
  - id: grep
    tool_policy: grep
pairing: graph_vs_grep
repeats: 1
agent_adapter: null
formal_judge_result: null
notes:
  - >-
    Smoke-only: validates that the case and ground-truth inputs parse and pass
    the case schema, ground-truth schema and the production rubric validator
    (bug_localization_v1). No formal Judge call, AgentAdapter, score, or
    artifact result is produced or implied by this configuration.
  - >-
    Judge model is pinned to glm-5.2 for traceability; in smoke mode no Judge
    network call is made, so this pin records intent rather than an executed
    identity.
