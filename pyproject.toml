[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbenchmark"
version = "0.1.0"
description = "A focused benchmark for comparing graph-assisted and text-search code investigation"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graphbenchmark = "graphbenchmark.cli:main"

[tool.setuptools.packages.find]
include = ["graphbenchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
