[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbenchmark-ai-score"
version = "0.1.0"
description = "GraphBenchmark AI scoring system (semantic_outcome_v1)."
requires-python = ">=3.12,<3.13"
# jsonschema validates Agent Answer/GT contracts and PyYAML loads scoring
# Profiles; both are imported by production code (AIS-003/AIS-004).
dependencies = [
    "jsonschema>=4.20",
    "PyYAML>=6.0",
]

[project.scripts]
graphbenchmark = "runner.benchmark_runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
# ``schemas`` and ``profiles`` are packages so their runtime resources
# (``*.schema.json`` and ``*.yaml``) ship inside the wheel and are locatable
# at runtime via ``importlib.resources``. The top-level files remain the source
# of truth; declaring them as package data only changes runtime location.
packages = ["runner", "judge", "scoring", "report", "schemas", "profiles"]

[tool.setuptools.package-data]
schemas = ["*.schema.json"]
profiles = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
