[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbenchmark-ai-score"
version = "0.1.0"
description = "GraphBenchmark AI scoring system (semantic_outcome_v1)."
requires-python = ">=3.12,<3.13"
# jsonschema is imported by runner.artifact_validation at runtime (AIS-003 R2):
# it is a production dependency, not a dev-only tool.
dependencies = ["jsonschema>=4.20"]

[project.scripts]
graphbenchmark = "runner.benchmark_runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["runner", "judge", "scoring", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
